<title>Lume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
/* Layout: janela de dois painéis (barra lateral fixa + biblioteca rolável); o leitor abre por cima, em tela cheia. */
:root{
  --bg:#FAF7F2; --side:#EEEAE4; --surface:#FFFFFF; --line:#E2DDD5; --fg:#1E2220; --muted:#6A706C;
  --field:#EAE6DF; --accent:#6C8F8C; --accent-strong:#5A7C79; --accent-soft:#BBCFCC; --accent-fg:#FFFFFF;
  --cont-hi:#E3EBEA; --hover:rgba(30,34,32,.05); --scrim:rgba(20,24,22,.38);
  --epub:#3A7FC1; --pdf:#E0533C; --mobi:#A89E2F;
  --t-epub:#DCE6EC; --t-pdf:#F6DCD4; --t-mobi:#EBE9CC;
  --bar-epub:#6C8F8C; --bar-pdf:#C97A62; --bar-mobi:#A89E2F;
  --shadow:0 1px 2px rgba(45,38,28,.06),0 8px 24px rgba(45,38,28,.08);
  --book-shadow:0 1px 1px rgba(0,0,0,.12),0 6px 14px rgba(40,30,20,.22);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181B1A; --side:#202423; --surface:#252A28; --line:#323836; --fg:#ECEDE8; --muted:#9AA19C;
  --field:#2A2F2D; --accent:#86AAA6; --accent-strong:#9BBDB9; --accent-soft:#34504D; --accent-fg:#0E1514;
  --cont-hi:#2A3533; --hover:rgba(255,255,255,.05); --scrim:rgba(0,0,0,.55);
  --t-epub:#223039; --t-pdf:#3A2723; --t-mobi:#33321F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181B1A; --side:#202423; --surface:#252A28; --line:#323836; --fg:#ECEDE8; --muted:#9AA19C;
  --field:#2A2F2D; --accent:#86AAA6; --accent-strong:#9BBDB9; --accent-soft:#34504D; --accent-fg:#0E1514;
  --cont-hi:#2A3533; --hover:rgba(255,255,255,.05); --scrim:rgba(0,0,0,.55);
  --t-epub:#223039; --t-pdf:#3A2723; --t-mobi:#33321F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden}

/* Barra lateral */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden auto;
  padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.side-top{display:flex;justify-content:flex-end;gap:4px;padding-bottom:14px}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:14px;padding:11px 14px;border:0;border-radius:12px;background:transparent;font-size:16.5px;text-align:left;cursor:pointer;color:var(--fg)}
.nav-item svg{color:var(--muted)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--accent-soft)}
.nav-item.active svg{color:var(--fg)}
.nav-item .n{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.side h3{margin:26px 14px 10px;font-size:16px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 10px}
.chip{border:0;border-radius:999px;background:var(--field);padding:7px 15px;font-size:15px;cursor:pointer}
.chip:hover{filter:brightness(.97)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.side-note{margin:auto 10px 12px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.import{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);padding:14px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.2) inset}
.import:hover{background:var(--accent-strong)}

/* Área principal */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app:not(.collapsed) #side-open{display:none}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--field);border-radius:12px;padding:0 14px;height:46px;max-width:1220px;margin-inline:auto}
.search svg{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--fg);outline:none}
.search input::placeholder{color:var(--muted)}
.content{flex:1;overflow:auto;padding-block:26px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.content-inner{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:38px}
.content-inner.narrow{max-width:820px}
.sec{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec h2{margin:0;font-size:26px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.sec .count{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.back-link{border:0;background:none;color:var(--accent-strong);cursor:pointer;padding:0;font-size:14px;font-weight:600}

/* Continuar lendo */
.cont-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:22px}
.cont{display:flex;gap:18px;align-items:center;padding:12px 18px 12px 12px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;min-width:0}
.cont.current{background:var(--cont-hi)}
.cont:hover{transform:translateY(-1px)}
.cont-cover{width:86px;flex:none;aspect-ratio:2/3;border-radius:3px 5px 5px 3px;overflow:hidden;box-shadow:var(--book-shadow)}
.cont-cover img{width:100%;height:100%;object-fit:cover;display:block}
.cont-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.cont-top{display:flex;align-items:flex-start;gap:10px}
.cont-title{flex:1;min-width:0;font-size:18px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.cont-meta{font-size:13px;color:var(--muted)}
.cont-prog{display:flex;align-items:center;gap:14px;margin-top:8px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--bar-epub)}
.bar.pdf i{background:var(--bar-pdf)} .bar.mobi i{background:var(--bar-mobi)}
.cont-prog span{font-size:15px;font-variant-numeric:tabular-nums}

.badge{display:inline-block;flex:none;border-radius:10px;padding:4px 11px;font-size:14px;font-weight:600;color:#fff;background:var(--epub);line-height:1.25}
.badge.pdf{background:var(--pdf)} .badge.mobi{background:var(--mobi)}

/* Grade de livros */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 24px}
.card{position:relative;min-width:0}
.card-hit{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;cursor:pointer;text-align:center}
.cover-wrap{position:relative;width:100%;aspect-ratio:4/5;border-radius:16px;background:var(--t-epub);display:flex;align-items:flex-end;justify-content:center;padding:18px 26px 12px;box-sizing:border-box;transition:transform .2s ease}
.card[data-format="pdf"] .cover-wrap{background:var(--t-pdf)}
.card[data-format="mobi"] .cover-wrap{background:var(--t-mobi)}
.card-hit:hover .cover-wrap{transform:translateY(-3px)}
.cover{height:100%;aspect-ratio:2/3;max-width:100%;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:var(--book-shadow);background:var(--surface)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-wrap .badge{position:absolute;top:10px;right:10px}
.mini-prog{position:absolute;left:26px;right:26px;bottom:5px;height:3px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden}
.mini-prog i{display:block;height:100%;background:var(--accent)}
.card-title{font-size:16.5px;line-height:1.3;text-wrap:balance;overflow-wrap:anywhere}
.card-sub{font-size:13px;color:var(--muted);margin-top:-6px}
.tag-sample{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.card-more{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:9px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .15s}
.card:hover .card-more,.card:focus-within .card-more{opacity:1}
.card-fav{position:absolute;bottom:18px;left:12px;color:#D9534F;pointer-events:none}
.card-fav svg{fill:currentColor;width:18px;height:18px}
@media (hover:none){.card-more{opacity:1}}

/* Coleções e notas */
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:20px}
.col-tile{display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);cursor:pointer;text-align:left}
.col-tile:hover{box-shadow:var(--shadow)}
.col-stack{display:flex;height:96px}
.col-stack .cover{height:96px;margin-right:-22px;border:2px solid var(--surface)}
.col-tile strong{font-size:17px}
.col-tile span{color:var(--muted);font-size:13px}
.note-group{display:flex;flex-direction:column;gap:10px}
.note-group h3{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.note{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;cursor:pointer;width:100%;box-sizing:border-box}
.note:hover{box-shadow:var(--shadow)}
.note .where{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.note-row{position:relative}
.note-row .note{padding-right:52px}
.note-row .del{position:absolute;top:8px;right:8px}
.col-edit{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted)}
.col-edit input{flex:1;min-width:180px;max-width:360px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font:inherit;color:var(--fg)}
.btn.danger{background:#C7432F;color:#fff}
.brand{margin-right:auto;align-self:center;padding-left:6px;font-family:var(--read);font-size:22px;font-weight:600;letter-spacing:.01em;color:var(--accent-strong)}
.note blockquote{margin:0;padding-left:12px;border-left:3px solid #E2BE62;font-family:var(--read);font-style:italic;line-height:1.5;color:var(--fg)}
.note p{margin:0;line-height:1.5}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:48px 16px;border:1.5px dashed var(--line);border-radius:18px;color:var(--muted)}
.empty strong{color:var(--fg);font-size:17px}
.empty p{margin:0;max-width:44ch;line-height:1.5}
.empty .import{margin-top:6px;padding:11px 18px;font-size:15px}

/* Menus, modal, toast */
.menu{position:fixed;z-index:60;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer;font-size:14.5px}
.menu button:hover{background:var(--hover)}
.menu .danger{color:#C7432F}
.menu p{margin:6px 10px;font-size:13.5px;color:var(--muted);max-width:26ch;line-height:1.4}
.menu .row{display:flex;gap:6px;padding:4px}
.menu .row button{flex:1;justify-content:center;background:var(--field)}
.menu .row .danger{background:#C7432F;color:#fff}
.modal{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding:16px}
.modal-card{width:min(420px,100%);background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.modal-card h3{margin:0;font-size:19px}
.modal-card label{font-size:13px;color:var(--muted)}
.modal-card input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;color:var(--fg)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--field);cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:var(--shadow)}
.drop{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;pointer-events:none}
.drop div{background:var(--surface);border:2px dashed var(--accent);border-radius:20px;padding:36px 44px;font-size:18px;font-weight:600}

/* Leitor */
.reader{--r-bg:#FBF8F3;--r-fg:#1F2321;--r-bar:#F2EEE7;--r-line:#E2DCD3;--r-muted:#6B706C;--r-field:#E8E3DA;
  position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--r-bg);color:var(--r-fg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader[data-rt="sepia"]{--r-bg:#F4E8D2;--r-fg:#3A2E21;--r-bar:#EBDDC2;--r-line:#DCCAA8;--r-muted:#7A6A55;--r-field:#E2D2B3}
.reader[data-rt="dark"]{--r-bg:#151716;--r-fg:#E2E3DE;--r-bar:#1D201F;--r-line:#2D3230;--r-muted:#8F968F;--r-field:#2A2E2C;color-scheme:dark}
.r-bar{display:flex;align-items:center;gap:8px;background:var(--r-bar);border-bottom:1px solid var(--r-line);padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.r-bar .icon-btn{color:var(--r-muted)}
.r-bar .icon-btn:hover{background:rgba(127,127,127,.12);color:var(--r-fg)}
.r-bar .icon-btn[aria-pressed="true"]{color:#D9534F}
.r-bar .icon-btn[aria-pressed="true"] svg{fill:currentColor}
.r-back{display:flex;align-items:center;gap:4px;border:0;background:none;padding:8px 10px 8px 4px;border-radius:10px;cursor:pointer;color:var(--r-fg);font-weight:600}
.r-back:hover{background:rgba(127,127,127,.12)}
.r-titles{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.r-titles strong{font-size:15px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-titles span{font-size:12.5px;color:var(--r-muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tools{display:flex;align-items:center;gap:2px}
.sizes{display:flex;align-items:center;border-radius:10px;background:var(--r-field);margin-inline:4px}
.sizes button{border:0;background:none;width:36px;height:34px;cursor:pointer;color:var(--r-fg);font-family:var(--read)}
.sizes .sm{font-size:13px} .sizes .lg{font-size:18px}
.sizes.layout{padding:2px;gap:2px}
.sizes.layout button{display:grid;place-items:center;width:34px;height:30px;border-radius:8px;color:var(--r-muted)}
.sizes.layout button[aria-pressed="true"]{background:var(--r-bg);color:var(--r-fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sizes.layout svg{width:20px;height:20px}
.swatches{display:flex;gap:6px;margin-inline:6px}
.swatch{width:24px;height:24px;border-radius:50%;border:1px solid var(--r-line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--r-bg),0 0 0 4px var(--r-muted)}
.r-body{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;min-height:0}
.r-nav{border:0;background:none;color:var(--r-muted);cursor:pointer;display:grid;place-items:center}
.r-nav:hover{color:var(--r-fg);background:rgba(127,127,127,.07)}
.r-nav svg{width:28px;height:28px}
.r-stage{position:relative;min-height:0;min-width:0;overflow:hidden}
.r-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--r-muted);line-height:1.5}
.r-foot{display:flex;align-items:center;gap:14px;border-top:1px solid var(--r-line);background:var(--r-bar);padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--r-muted);font-variant-numeric:tabular-nums}
.r-foot input{flex:1;min-width:0;accent-color:#6C8F8C}
#r-pct{min-width:3.2em;font-weight:600;color:var(--r-fg)}
#r-pos{min-width:0;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}

.pdf-scroller{position:absolute;inset:0;overflow:auto;display:flex;padding:16px;box-sizing:border-box}
.pdf-wrap{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.pdf-page{display:block;background:#fff}
.pdf-hl-layer{position:absolute;inset:0;z-index:1;pointer-events:none}
.pdf-hl{position:absolute;border-radius:2px;mix-blend-mode:multiply}
.reader[data-rt="dark"] .pdf-hl{mix-blend-mode:normal}
/* Camada de texto do pdf.js (texto invisível sobre a página, para poder selecionar) */
.textLayer{position:absolute;text-align:initial;inset:0;overflow:hidden;opacity:1;line-height:1;-webkit-text-size-adjust:none;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer span.markedContent{top:0;height:0}
.textLayer ::selection{background:rgba(70,130,230,.32)}
.textLayer br::selection{background:transparent}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:-1;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
/* Barra de marcação */
.hl-bar{position:fixed;z-index:20;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:14px;background:var(--r-bar);border:1px solid var(--r-line);box-shadow:0 8px 24px rgba(0,0,0,.22);color:var(--r-fg)}
.hl-colors{display:flex;gap:6px;padding:0 2px}
.hl-dot{width:26px;height:26px;border-radius:50%;border:2px solid rgba(0,0,0,.1);background:var(--c);cursor:pointer;padding:0;transition:transform .12s ease}
.hl-dot:hover{transform:scale(1.14)}
.hl-dot[aria-pressed="true"]{box-shadow:0 0 0 2px var(--r-bar),0 0 0 4px var(--r-fg)}
.hl-bar .sep{width:1px;height:22px;background:var(--r-line)}
.hl-bar .icon-btn{width:34px;height:34px;color:var(--r-fg)}
.hl-bar .icon-btn:hover{background:rgba(127,127,127,.14)}
.hl-bar #hl-del{color:#C7432F}
mark.hl{color:inherit;border-radius:2px;cursor:pointer;padding:0}
.reader[data-rt="dark"] .pdf-page{filter:invert(.9) hue-rotate(180deg)}
.reader[data-rt="sepia"] .pdf-page{filter:sepia(.4) brightness(.96)}
.epub-host{position:absolute;inset:18px 0 10px;max-width:1180px;margin:0 auto}
.flow-vp{position:absolute;inset:0;max-width:760px;margin:0 auto;overflow:hidden}
.flow{box-sizing:border-box;height:100%;font-family:var(--read);font-size:1.12rem;line-height:1.7;color:var(--r-fg);column-fill:auto;transition:transform .28s ease;overflow-wrap:break-word}
.flow img{max-width:100%;max-height:var(--colh,70vh);height:auto;display:block;margin:1em auto;break-inside:avoid}
.flow .pb{break-before:column;height:0}
.flow h1,.flow h2,.flow h3{line-height:1.25;break-after:avoid;text-wrap:balance}
.flow p{margin:0 0 .85em;hyphens:auto}
.flow a{color:inherit}
.flow ::selection{background:rgba(226,190,98,.45)}
/* Régua de leitura */
.ruler{position:absolute;z-index:3;pointer-events:none;overflow:hidden}
.ruler-shade{position:absolute;left:0;right:0;background:var(--r-bg);opacity:var(--shade,.6);transition:height .18s ease,top .18s ease,opacity .15s ease}
.shade-wrap{position:relative}
.shade-pop{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);width:244px;box-sizing:border-box;padding:12px 14px;border-radius:12px;background:var(--r-bar);border:1px solid var(--r-line);box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;white-space:normal;color:var(--r-fg)}
.ruler-ctl.at-top .shade-pop{bottom:auto;top:calc(100% + 12px)}
.shade-pop label{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--r-muted)}
.shade-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--r-muted);font-variant-numeric:tabular-nums}
.shade-row input{flex:1;min-width:0;accent-color:#6C8F8C}
#ru-shade-val{min-width:2.6em;text-align:right;font-weight:600;color:var(--r-fg)}
.shade-presets{display:flex;gap:4px}
.shade-presets button{flex:1;border:0;border-radius:8px;padding:6px 0;background:var(--r-field);color:var(--r-fg);cursor:pointer;font-size:12.5px}
.shade-presets button[aria-pressed="true"]{background:#6C8F8C;color:#fff}
#ru-shade[aria-expanded="true"]{background:rgba(127,127,127,.16)}
.ruler-shade.top{top:0}
.ruler-shade.bottom{bottom:0}
.ruler-band{position:absolute;top:0;border-radius:5px;background:rgba(108,143,140,.12);box-shadow:inset 0 -2px 0 #6C8F8C;transition:transform .18s ease,height .18s ease,left .18s ease,width .18s ease}
.ruler.empty .ruler-band,.ruler.empty .ruler-shade{display:none}
.ruler-ctl{position:absolute;z-index:4;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:14px;background:var(--r-bar);border:1px solid var(--r-line);box-shadow:0 6px 20px rgba(0,0,0,.16);font-size:13px;color:var(--r-muted);white-space:nowrap;max-width:calc(100% - 16px);box-sizing:border-box}
.ruler-ctl.at-top{bottom:auto;top:10px}
.ruler-ctl .icon-btn{width:34px;height:34px;color:var(--r-fg)}
.ruler-ctl .icon-btn:hover{background:rgba(127,127,127,.12)}
.ruler-ctl .icon-btn[aria-pressed="true"]{background:#6C8F8C;color:#fff}
.ruler-ctl .sep{width:1px;height:20px;background:var(--r-line);margin:0 4px;flex:none}
.speed{display:flex;align-items:center;font-variant-numeric:tabular-nums}
.speed button{border:0;background:none;width:26px;height:30px;border-radius:8px;cursor:pointer;color:var(--r-fg);font-size:16px}
.speed button:hover{background:rgba(127,127,127,.12)}
#ruler-info{padding:0 6px;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis}
#r-ruler[aria-pressed="true"]{color:var(--r-fg);background:var(--r-field)}
#r-ruler[aria-pressed="true"] svg{fill:none}
@media (max-width:460px){#ruler-info,.ruler-ctl .sep:last-of-type{display:none}}
@media (prefers-reduced-motion:reduce){.flow,.cover-wrap,.ruler-band,.ruler-shade{transition:none}}

.r-panel{position:absolute;top:0;right:0;bottom:0;z-index:5;width:min(360px,100%);background:var(--r-bar);border-left:1px solid var(--r-line);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
.p-tabs{display:flex;align-items:center;gap:4px;padding:10px;border-bottom:1px solid var(--r-line)}
.p-tabs .tab{border:0;background:none;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--r-muted);font-weight:600}
.p-tabs .tab[aria-selected="true"]{background:var(--r-field);color:var(--r-fg)}
.p-tabs .icon-btn{margin-left:auto;color:var(--r-muted)}
.p-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.toc-item{border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--r-fg);line-height:1.35}
.toc-item:hover{background:rgba(127,127,127,.12)}
.toc-item.l1{padding-left:24px;font-size:14px} .toc-item.l2{padding-left:38px;font-size:13.5px}
.p-empty{color:var(--r-muted);padding:10px;line-height:1.5;font-size:14px}
.note-form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;background:var(--r-bg);border:1px solid var(--r-line)}
.note-form label{font-size:12px;color:var(--r-muted);letter-spacing:.04em;text-transform:uppercase}
.note-form blockquote{margin:0;padding-left:10px;border-left:3px solid #E2BE62;font-family:var(--read);font-style:italic;font-size:14px;line-height:1.45;max-height:7.5em;overflow:auto}
.note-form textarea{min-height:84px;resize:vertical;border:1px solid var(--r-line);border-radius:9px;background:var(--r-bar);color:var(--r-fg);font:inherit;padding:9px;font-size:14px}
.note-form .btn{align-self:flex-end;background:#6C8F8C;color:#fff}
.p-note{position:relative;display:flex;flex-direction:column;gap:5px;padding:11px 40px 11px 12px;border-radius:10px;border:1px solid var(--r-line);cursor:pointer;text-align:left;background:none;color:var(--r-fg)}
.p-note:hover{background:rgba(127,127,127,.08)}
.p-note small{color:var(--r-muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.p-note q{font-family:var(--read);font-style:italic;font-size:14px;line-height:1.45;quotes:"“" "”"}
.p-note span{font-size:14px;line-height:1.45}
.p-note .del{position:absolute;top:6px;right:6px;width:30px;height:30px}

@media (max-width:760px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .25s ease;visibility:visible!important;box-shadow:var(--shadow);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .app.drawer .side{transform:none}
  .app.drawer::after{content:"";position:fixed;inset:0;z-index:29;background:var(--scrim)}
  .app:not(.collapsed) #side-open{display:inline-grid}
  #side-collapse,#fullscreen{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}
  .cover-wrap{padding:14px 16px 10px}
  .mini-prog{left:16px;right:16px}
  .sec h2{font-size:22px}
  .r-body{grid-template-columns:minmax(0,1fr)}
  .r-nav{position:absolute;top:0;bottom:0;z-index:2;width:44px;opacity:.55}
  .r-nav.prev{left:0} .r-nav.next{right:0}
  .r-back span{display:none}
  .swatches{gap:4px;margin-inline:2px}
  .swatch{width:20px;height:20px}
  .r-tools .icon-btn{width:34px}
  .epub-host{inset:12px 40px 8px}
}

const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
if (window.pdfjsLib) {

const $ = (s, r = document) => r.querySelector(s);
const FMT = { pdf: 'PDF', epub: 'ePub', mobi: 'Mobi' };
const RT = { light: { bg: '#FBF8F3', fg: '#1F2321' }, sepia: { bg: '#F4E8D2', fg: '#3A2E21' }, dark: { bg: '#151716', fg: '#E2E3DE' } };

const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- Armazenamento ---------- */
// No programa para Windows (Lume.exe), tudo vai para arquivos em Documentos\Lume.
// Na web, fica no IndexedDB do navegador, com memória como reserva.
const DESKTOP = typeof window.ESTANTE_DESKTOP === 'string' ? window.ESTANTE_DESKTOP : null;
const Disk = {
  url: (store, key, ext) => '/api/' + store + (key != null ? '/' + encodeURIComponent(key) : '') + (ext ? '?ext=' + ext : ''),
  async all(store) { try { const r = await fetch(this.url(store)); return r.ok ? await r.json() : []; } catch { return []; } },
  async get(store, key) {
    try { const r = await fetch(this.url(store, key)); if (!r.ok) return undefined; return store === 'files' ? await r.arrayBuffer() : await r.json(); }
    catch { return undefined; }
  },
  async put(store, val, key, ext) {
    const body = store === 'files' ? val : JSON.stringify(val);
    try {
      const r = await fetch(this.url(store, key ?? val.id, ext), { method: 'PUT', body, keepalive: typeof body === 'string' && body.length < 60000 });
      if (!r.ok) throw new Error('erro ' + r.status);
    } catch (e) { toast('Não foi possível salvar no computador: ' + e.message + '. Verifique se o Lume ainda está aberto.', 6000); }
  },
  async del(store, key) { try { await fetch(this.url(store, key), { method: 'DELETE' }); } catch {} }
};
const DB = {
  db: null,
  mem: { books: new Map(), files: new Map(), notes: new Map() },
  async open() {
    if (DESKTOP) return;
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('lume', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('books', { keyPath: 'id' });
          d.createObjectStore('files');
          d.createObjectStore('notes', { keyPath: 'id' });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { this.db = null; }
  },
  run(store, mode, fn) {
    return new Promise((res, rej) => {
      const r = fn(this.db.transaction(store, mode).objectStore(store));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async all(store) {
    if (DESKTOP) return Disk.all(store);
    if (this.db) try { return await this.run(store, 'readonly', s => s.getAll()); } catch {}
    return [...this.mem[store].values()];
  },
  async get(store, key) {
    if (DESKTOP) return Disk.get(store, key);
    if (this.db) try { return await this.run(store, 'readonly', s => s.get(key)); } catch {}
    return this.mem[store].get(key);
  },
  async put(store, val, key, ext) {
    if (DESKTOP) return Disk.put(store, val, key, ext);
    this.mem[store].set(key ?? val.id, val);
    if (this.db) try { await this.run(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)); this.mem[store].delete(key ?? val.id); } catch {}
  },
  async del(store, key) {
    if (DESKTOP) return Disk.del(store, key);
    this.mem[store].delete(key);
    if (this.db) try { await this.run(store, 'readwrite', s => s.delete(key)); } catch {}
  }
};

const PALETTES = [['#2F4A47', '#EADBB8'], ['#7B2F2A', '#F2D8A8'], ['#1E2C46', '#D0E1F0'], ['#3F5230', '#E9E2BF'], ['#5A3A5E', '#F1DAE6'], ['#8A5A1E', '#FBEBC8'], ['#24403A', '#F5C9A0']];

  }

  const c = document.createElement('canvas'); c.width = 360; c.height = 540;
  const g = c.getContext('2d');
  const [bg, fg] = PALETTES[(seed ?? hashStr(title)) % PALETTES.length];
  g.fillStyle = bg; g.fillRect(0, 0, 360, 540);
  const sh = g.createLinearGradient(0, 0, 30, 0); sh.addColorStop(0, 'rgba(0,0,0,.28)'); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(0, 0, 30, 540);

  g.globalAlpha = .35; g.beginPath(); g.arc(182, 350, 46, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
  g.fillStyle = fg; g.textAlign = 'center';
  let size = 40; g.font = `600 ${size}px Literata, Georgia, serif`;

  while (lines.length > 4 && size > 24) { size -= 4; g.font = `600 ${size}px Literata, Georgia, serif`; lines = wrapCanvas(g, title, 252); }
  lines.slice(0, 5).forEach((l, i) => g.fillText(l, 182, 96 + i * size * 1.18));

function palmdoc(src) {

/* ---------- Metadados na importação ---------- */
async function extractMeta(format, buf, fileName) {
  const base = fileName.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ');
  let title = base, author = '', cover = null;
  if (format === 'pdf') {
    const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    try {
      const md = await doc.getMetadata();
      if (md?.info?.Title && md.info.Title.trim().length > 1) title = md.info.Title.trim();
      if (md?.info?.Author) author = md.info.Author.trim();
    } catch {}
    try {
      const p = await doc.getPage(1); const v1 = p.getViewport({ scale: 1 });
      const vp = p.getViewport({ scale: 360 / v1.width }); const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
      await p.render({ canvasContext: g, viewport: vp }).promise; cover = c.toDataURL('image/jpeg', .82);
    } catch {}
    doc.destroy();
  } else if (format === 'epub') {
    const book = ePub(buf.slice(0), { replacements: 'base64' });
    await book.ready;
    const md = book.packaging?.metadata || {};
    if (md.title) title = md.title; if (md.creator) author = md.creator;
    try { if (book.cover) { const data = await book.archive.getBase64(book.cover); if (data) cover = await shrinkImage(data); } } catch {}
    book.destroy();
  } else {
    const m = parseMobi(buf);
    if (m.title) title = m.title; author = m.author;
    if (m.cover) { const u = URL.createObjectURL(m.cover); cover = await shrinkImage(u); URL.revokeObjectURL(u); }
  }
  if (!cover) cover = drawCover(title, author).toDataURL('image/jpeg', .86);
  return { title, author, cover };
}

/* ---------- Estado ---------- */
const state = { books: [], notes: [], view: 'library', formats: new Set(), query: '', collection: null };
const isReading = b => b.progress > 0 && b.progress < 0.995;
const byLast = (a, b) => (b.lastOpened || 0) - (a.lastOpened || 0);
const saveTimers = {};
function saveBook(b, soon) {
  clearTimeout(saveTimers[b.id]);
  if (soon) saveTimers[b.id] = setTimeout(() => DB.put('books', { ...b }), 500);
  else DB.put('books', { ...b });
}

async function addBook(buf, format, meta) {
  const book = { id: uid(), title: meta.title, author: meta.author || '', format, cover: meta.cover, added: Date.now(), lastOpened: meta.lastOpened || 0,
    progress: meta.progress || 0, position: meta.position ?? null, favorite: !!meta.favorite, collection: meta.collection || '', sample: !!meta.sample };
  await DB.put('files', buf, book.id, format);
  await DB.put('books', book);

  return book;
}
function formatOf(name) {
  const ext = name.split('.').pop().toLowerCase();
  return ext === 'pdf' ? 'pdf' : ext === 'epub' ? 'epub' : ['mobi', 'azw', 'prc'].includes(ext) ? 'mobi' : null;
}
async function importFiles(files) {
  let ok = 0;
  for (const f of files) {
    const format = formatOf(f.name);
    if (!format) { toast(`“${f.name}” não é PDF, ePub ou Mobi.`); continue; }
    toast(`Importando “${f.name}”…`, 60000);
    try {
      const buf = await f.arrayBuffer();
      const meta = await extractMeta(format, buf, f.name);
      await addBook(buf, format, meta); ok++;
    } catch (e) { toast(`Não foi possível ler “${f.name}”: ${e?.message || 'arquivo inválido'}.`, 6000); return render(); }
  }
  if (ok) { toast(ok === 1 ? 'Livro importado.' : `${ok} livros importados.`); state.view = 'library'; state.collection = null; }
  render();
}

/* ---------- Régua de leitura ---------- */
const Ru = { on: pref.get('ruler', false), lines: [], idx: 0, pending: null, lastKey: null, auto: false, timer: null, wpm: pref.get('wpm', 220), seq: 0 };

// Junta os retângulos de texto em linhas, na ordem de leitura (coluna/página, depois de cima para baixo).
function clusterLines(rects) {
  rects = rects.filter(r => r.right - r.left > 0.5 && r.bottom - r.top > 2);
  rects.sort((a, b) => (a.col - b.col) || (a.top - b.top) || (a.left - b.left));
  const lines = [];
  for (const r of rects) {
    const h = r.bottom - r.top; let hit = null;
    for (let i = lines.length - 1; i >= 0 && i >= lines.length - 4; i--) {
      const L = lines[i]; if (L.col !== r.col) break;
      const ov = Math.min(L.bottom, r.bottom) - Math.max(L.top, r.top);
      if (ov > Math.min(h, L.bottom - L.top) * .5 && r.left - L.right < h * 4 && L.left - r.right < h * 4) { hit = L; break; }
    }
    if (hit) { hit.top = Math.min(hit.top, r.top); hit.bottom = Math.max(hit.bottom, r.bottom); hit.left = Math.min(hit.left, r.left); hit.right = Math.max(hit.right, r.right); hit.chars += r.chars || 0; }
    else lines.push({ col: r.col, top: r.top, bottom: r.bottom, left: r.left, right: r.right, chars: r.chars || 0 });
  }
  return lines.sort((a, b) => (a.col - b.col) || (a.top - b.top));
}
// Retângulos de cada trecho de texto de um documento (cada fragmento de linha gera um retângulo).
function textRects(root, fontPx) {
  const out = [], doc = root.ownerDocument, rg = doc.createRange();
  const tw = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => /\S/.test(n.data) ? 1 : 2 });
  for (let n; (n = tw.nextNode());) {
    rg.selectNodeContents(n);
    for (const r of rg.getClientRects()) if (r.width >= 1 && r.height >= 2) out.push({ top: r.top, bottom: r.bottom, left: r.left, right: r.right, chars: r.width / (fontPx * .48) });
  }
  return out;
}

async function rulerRefresh(mode = 'keep', attempt = 0) {
  if (!Ru.on || !R.impl?.lines) return drawRuler();
  const my = ++Ru.seq; Ru.pending = null;
  await new Promise(r => setTimeout(r, 60)); // deixa o layout assentar depois da virada de página
  let lines = [];
  try { lines = await R.impl.lines(); } catch (e) { console.warn(e); }
  if (my !== Ru.seq || !Ru.on) return;
  // A página nova pode ainda não ter sido desenhada (comum no ePub ao trocar de capítulo): tenta de novo.
  if (!lines.length && attempt < 3) { setTimeout(() => { if (my === Ru.seq) rulerRefresh(mode, attempt + 1); }, 250); return; }

  else if (prev) { let best = 0, bd = Infinity; lines.forEach((L, i) => { const d = Math.abs(L.top - prev.top); if (d < bd) { bd = d; best = i; } }); Ru.idx = best; }
  else Ru.idx = 0;

}
function reveal() { const L = Ru.lines[Ru.idx]; if (L) R.impl?.reveal?.(L); }

  el.hidden = ctl.hidden = !Ru.on; $('#r-ruler').setAttribute('aria-pressed', Ru.on);
  $('#ru-auto').setAttribute('aria-pressed', Ru.auto);
  $('#ru-auto').innerHTML = Ru.auto ? '<svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.2"/></svg>' : '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></svg>';
  $('#ru-wpm').textContent = `${Ru.wpm} ppm`;
  clearTimeout(Ru.timer);
  if (!Ru.on) return;
  Object.assign(el.style, { left: st.offsetLeft + 'px', top: st.offsetTop + 'px', width: st.clientWidth + 'px', height: st.clientHeight + 'px' });
  const L = Ru.lines[Ru.idx];
  el.classList.toggle('empty', !L);
  $('#ruler-info').textContent = L ? `Linha ${Ru.idx + 1} de ${Ru.lines.length}` : 'Sem texto nesta página';
  if (L) {

    const left = Math.max(0, L.left - 12), width = Math.min(st.clientWidth, L.right + 12) - left;
    const band = $('#r-band');
    band.style.transform = `translateY(${top}px)`; band.style.height = h + 'px'; band.style.left = left + 'px'; band.style.width = width + 'px';
    $('#rs-top').style.height = Math.max(0, top) + 'px';

  }

async function PdfView(stage, buf, b) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
  stage.innerHTML = '<div class="pdf-scroller"><div class="pdf-wrap"><canvas class="pdf-page"></canvas><div class="pdf-hl-layer"></div><div class="textLayer"></div></div></div>';
  const scroller = stage.firstChild, wrap = scroller.firstChild, canvas = wrap.querySelector('canvas');
  const hlLayer = wrap.querySelector('.pdf-hl-layer'), textLayer = wrap.querySelector('.textLayer');
  const N = doc.numPages; let page = clamp(parseInt(b.position, 10) || 1, 1, N), zoom = R.size / 100, task = null, seq = 0, curScale = 1;
  const texts = new Map();
  const getText = async pg => {
    let t = texts.get(pg);
    if (!t) { const p = await doc.getPage(pg); const tc = await p.getTextContent(); t = { p, tc, items: tc.items }; texts.set(pg, t); }
    return t;
  };
  // Marcações da página atual, guardadas como retângulos relativos ao tamanho da página (0 a 1)
  const repaintHl = () => {
    hlLayer.innerHTML = state.notes.filter(n => n.bookId === b.id && n.rects && +n.pos === page).map(n =>
      n.rects.map(([x, y, w, h]) => `<div class="pdf-hl" data-note="${n.id}" style="left:${x * 100}%;top:${y * 100}%;width:${w * 100}%;height:${h * 100}%;background:${hlRgba(n)}"></div>`).join('')).join('');
  };
  const pdfSel = () => {
    const s = getSelection(); if (!s || s.isCollapsed || !s.rangeCount) return null;
    const r = s.getRangeAt(0); if (!textLayer.contains(r.commonAncestorContainer)) return null;
    const quote = s.toString().replace(/\s+/g, ' ').trim(); if (!quote) return null;
    const wr = wrap.getBoundingClientRect();
    const rects = [...r.getClientRects()].filter(x => x.width > 1 && x.height > 1 && x.height < wr.height * .2).slice(0, 300)
      .map(x => [(x.left - wr.left) / wr.width, (x.top - wr.top) / wr.height, x.width / wr.width, x.height / wr.height].map(v => +v.toFixed(5)));
    if (!rects.length) return null;

  };
  wrap.addEventListener('click', e => {
    if (!getSelection().isCollapsed) return;
    for (const d of hlLayer.children) {

    const dpr = Math.min(2.5, window.devicePixelRatio || 1), scale = Math.max(.2, fit * zoom);

    // Camada de texto selecionável por cima da imagem da página
    textLayer.innerHTML = ''; textLayer.style.setProperty('--scale-factor', scale);
    const cssVp = p.getViewport({ scale });
    getText(page).then(t => {
      if (my !== seq) return;
      try { pdfjsLib.renderTextLayer({ textContentSource: t.tc, textContent: t.tc, container: textLayer, viewport: cssVp }); } catch (e) { console.warn(e); }
    });

    info: () => ({ label: `Página ${page} de ${N}`, fraction: N > 1 ? (page - 1) / (N - 1) : 1, progress: page / N, pos: page }),
    async toc() {

    noteCtx: () => pdfSel() || { pos: page, label: `Página ${page}`, quote: '' },
    selectionInfo: pdfSel,
    clearSelection: () => getSelection().removeAllRanges(),
    paint: repaintHl, unpaint: repaintHl,
    goPos: p => go(parseInt(p, 10) || 1),
    destroy: () => { seq++; task?.cancel(); doc.destroy(); }
  };
}

async function EpubView(stage, buf, b) {
  stage.innerHTML = '<div class="epub-host"></div>';

  const book = ePub(buf.slice(0), { replacements: 'base64' });

  const rendition = book.renderTo(host, { width: '100%', height: '100%', flow: 'paginated', spread: R.spread === 'two' ? 'auto' : 'none', minSpreadWidth: 1, allowScriptedContent: false });
  rendition.themes.default({ img: { 'max-width': '100%' }, '::selection': { background: 'rgba(226,190,98,.45)' }, a: { color: 'inherit' } });
  const theme = t => { rendition.themes.override('color', RT[t].fg); rendition.themes.override('background', RT[t].bg); };

    return hit ? hit.label : '';

  rendition.on('selected', (cfi, contents) => {
    try {

  };

async function MobiView(stage, buf, b) {
  const m = parseMobi(buf);
  const { body, urls } = mobiToHtml(m);
  stage.innerHTML = '<div class="flow-vp"><div class="flow"></div></div>';
  const vp = stage.querySelector('.flow-vp'), flow = vp.firstChild;
  flow.innerHTML = body;
  let pages = 1, page = 0, w = 1, size = R.size, rcache = null;
  const frac = () => pages > 1 ? page / (pages - 1) : 1;
  const show = () => { flow.style.transform = `translateX(${-page * w}px)`; onLocation(); };
  function layout(keep) {
    const f = keep ?? (typeof b.position === 'number' ? b.position : 0);
    w = vp.clientWidth; const h = vp.clientHeight, pad = Math.round(clamp(w * .06, 18, 44));
    flow.style.padding = `30px ${pad}px`; flow.style.columnWidth = (w - 2 * pad) + 'px'; flow.style.columnGap = (2 * pad) + 'px';
    flow.style.fontSize = (1.12 * size / 100) + 'rem'; flow.style.setProperty('--colh', (h - 80) + 'px');
    pages = Math.max(1, Math.round(flow.scrollWidth / w)); rcache = null;
    page = clamp(Math.round(f * (pages - 1)), 0, pages - 1); show();
  }
  let relayT; const relayout = () => { clearTimeout(relayT); relayT = setTimeout(() => layout(frac()), 120); };
  flow.querySelectorAll('img').forEach(i => i.complete || i.addEventListener('load', relayout));
  flow.addEventListener('click', e => {
    if (e.target.closest('a')) e.preventDefault();
    const m = e.target.closest('mark[data-note]');
    if (m && getSelection().isCollapsed) showHlBar({ kind: 'edit', noteId: m.dataset.note }, m.getBoundingClientRect());
  });
  // Marcações: guardadas como posição (em caracteres) dentro do texto do livro, independente do layout
  const paint = n => {
    if (!n.anchor) return;
    unpaint(n);
    const { start, end } = n.anchor, tw = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT), hits = [];
    let pos = 0;
    for (let t; (t = tw.nextNode());) {
      const len = t.data.length, a = Math.max(start, pos), z = Math.min(end, pos + len);
      if (a < z) hits.push([t, a - pos, z - pos]);
      pos += len; if (pos >= end) break;
    }
    for (const [t, a, z] of hits) {
      let node = t;
      if (a > 0) node = node.splitText(a);

      node.parentNode.insertBefore(mk, node); mk.appendChild(node);
    }
  };

    const marks = flow.querySelectorAll(`mark[data-note="${n.id}"]`);
    marks.forEach(m => m.replaceWith(...m.childNodes));
    if (marks.length) flow.normalize();
  }
  const mobiSel = () => {
    const s = getSelection(); if (!s || s.isCollapsed || !s.rangeCount) return null;
    const r = s.getRangeAt(0); if (!flow.contains(r.commonAncestorContainer)) return null;
    const raw = r.toString(), quote = raw.replace(/\s+/g, ' ').trim(); if (!quote) return null;
    const pre = document.createRange(); pre.selectNodeContents(flow); pre.setEnd(r.startContainer, r.startOffset);
    const start = pre.toString().length;
    return { quote, pos: frac(), label: `Página ${page + 1}`, anchor: { start, end: start + raw.length }, rect: r.getBoundingClientRect() };
  };
  state.notes.filter(n => n.bookId === b.id).forEach(paint);
  layout();
  const headings = () => [...flow.querySelectorAll('h1,h2,h3')].filter(h => h.textContent.trim()).map(h => ({ label: h.textContent.trim().replace(/\s+/g, ' ').slice(0, 90), lvl: +h.tagName[1] - 1, el: h }));
  const pageOf = el => clamp(Math.floor((el.getBoundingClientRect().left - flow.getBoundingClientRect().left) / w), 0, pages - 1);
  return {
    next: () => { if (page < pages - 1) { page++; show(); } }, prev: () => { if (page > 0) { page--; show(); } },
    goFraction: f => { page = clamp(Math.round(f * (pages - 1)), 0, pages - 1); show(); },
    setSize: s => { size = s; layout(frac()); }, setTheme() {}, resize: () => layout(frac()),
    preview: f => `Página ${Math.round(f * (pages - 1)) + 1} de ${pages}`,
    info: () => ({ label: `Página ${page + 1} de ${pages}`, fraction: frac(), progress: (page + 1) / pages, pos: frac() }),
    toc: async () => { const hs = headings(); const minL = Math.min(...hs.map(h => h.lvl)); return hs.map(h => ({ ...h, lvl: Math.min(2, h.lvl - minL) })); },
    goToc: it => { page = pageOf(it.el); show(); },
    async lines() {

        const fr = flow.getBoundingClientRect(), fs = parseFloat(getComputedStyle(flow).fontSize) || 18;
        rcache = textRects(flow, fs).map(r => ({ ...r, page: Math.floor(((r.left + r.right) / 2 - fr.left) / w), top: r.top - fr.top, bottom: r.bottom - fr.top, left: r.left - fr.left, right: r.right - fr.left }));
      }
      const vr = vp.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      const ox = vr.left - sr.left - page * w, oy = vr.top - sr.top;
      return clusterLines(rcache.filter(r => r.page === page).map(r => ({ col: 0, chars: r.chars, top: r.top + oy, bottom: r.bottom + oy, left: r.left + ox, right: r.right + ox })));
    },
    noteCtx: () => mobiSel() || { pos: frac(), quote: '', label: `Página ${page + 1}` },
    selectionInfo: mobiSel,
    clearSelection: () => getSelection().removeAllRanges(),
    paint, unpaint,
    goPos: p => { page = clamp(Math.round(Number(p) * (pages - 1)), 0, pages - 1); show(); },
    destroy: () => urls.forEach(u => URL.revokeObjectURL(u))
  };
}

async function openBook(id, pos) {
  const b = state.books.find(x => x.id === id); if (!b) return;
  closeMenu();
  const buf = await DB.get('files', id);
  if (!buf) return toast('O arquivo deste livro não está mais salvo neste navegador. Importe-o de novo.', 5000);
  if (R.impl) closeReader(true);
  R.book = b; R.panelCtx = null;
  Ru.auto = false; Ru.lines = []; Ru.lastKey = null; Ru.pending = Ru.on ? 'first' : null; drawRuler();
  const rd = $('#reader'); rd.hidden = false; rd.dataset.rt = R.rt;
  $('#r-title').textContent = b.title;
  $('#r-sub').textContent = [FMT[b.format], b.author].filter(Boolean).join(' · ');
  $('#r-fav').setAttribute('aria-pressed', b.favorite);
  $('#r-layout').hidden = b.format !== 'epub'; syncSpread();
  document.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s.dataset.rt === R.rt));
  $('#r-panel').hidden = true; $('#r-pct').textContent = ''; $('#r-pos').textContent = '';
  const stage = $('#r-stage');
  stage.innerHTML = '<div class="r-msg">Abrindo o livro…</div>';
  try {
    const make = { pdf: PdfView, epub: EpubView, mobi: MobiView }[b.format];
    const impl = await make(stage, buf, b);
    if (R.book !== b) return impl.destroy();
    R.impl = impl;
    if (pos != null) await impl.goPos(pos);
    onLocation();
  } catch (e) {
    console.error(e);
    stage.innerHTML = `<div class="r-msg"><div><strong>Não foi possível abrir este livro.</strong><br>${esc(e?.message || 'O arquivo parece estar corrompido.')}</div></div>`;
  }
}
function closeReader(silent) {
  if (R.book) saveBook(R.book);

  R.impl = null; R.book = null; hideHlBar();
  Ru.auto = false; Ru.lines = []; Ru.seq++; Ru.busy = false; clearTimeout(Ru.timer);

}

  tasks.push(canvasBytes(cM).then(bytes => addBook(makeSampleMobi(bytes), 'mobi', { title: SAMPLE_MOBI.title, author: 'Lume', cover: jpg(cM), sample: true, progress: .25, position: .25, lastOpened: now - 2000, collection: 'Contos' })));
  await Promise.allSettled(tasks);
  pref.set('seeded', true);
}

/* ---------- Modo demonstração (só na versão web): gera as capturas de tela do README ---------- */
async function demoShot(name) {
  const w = ms => new Promise(r => setTimeout(r, ms));
  const find = f => state.books.find(b => b.format === f);
  const toStory = async () => {
    const b = find('mobi'); b.position = 0; await openBook(b.id); await w(400);
    const it = (await R.impl.toc()).find(t => t.label === 'O relojoeiro'); if (it) R.impl.goToc(it); await w(400);
  };
  const anchorOf = phrase => { const t = document.querySelector('.flow').textContent, i = t.indexOf(phrase); return i < 0 ? null : { start: i, end: i + phrase.length }; };
  if (name === 'leitor') {
    if (Ru.on) rulerToggle(false);
    R.spread = 'one'; R.rt = 'sepia'; R.size = 125; const b = find('epub'); b.position = null; await openBook(b.id); await w(800);
    const it = (await R.impl.toc()).find(t => t.label === 'Lendo com conforto'); if (it) await R.impl.goToc(it); await w(1500);
  }
  if (name === 'regua') {
    R.spread = 'one'; await toStory();
    Ru.shade = 60; applyShade(); rulerToggle(true); await w(500); rulerStep(1); await w(250); rulerStep(1); await w(400);
  }
  if (name === 'marcacao') {
    await toStory(); if (Ru.on) rulerToggle(false);
    [['relojoeiro que nunca acertava o próprio relógio', 'amarelo'], ['paciência de monge', 'verde'], ['sete minutos atrasado', 'azul']].forEach(([p, color], i) => {
      const a = anchorOf(p); if (a) R.impl.paint({ id: 'demo' + i, bookId: R.book.id, quote: p, anchor: a, color });
    });
    const flow = document.querySelector('.flow'), tw = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT);
    for (let t; (t = tw.nextNode());) {
      const i = t.data.indexOf('atrasou o próprio relógio');
      if (i >= 0) { const r = document.createRange(); r.setStart(t, i); r.setEnd(t, i + 25); getSelection().removeAllRanges(); getSelection().addRange(r); checkSelection(); break; }
    }
  }
  document.title = 'pronto';
}

/* ---------- Início ---------- */
(async function boot() {
  await DB.open();
  if (DESKTOP) {
    const note = $('.side-note');
    note.innerHTML = `Seus livros, anotações e o ponto de leitura ficam salvos neste computador, em <b>${esc(DESKTOP)}</b>. <button class="back-link" id="open-folder" style="display:inline">Abrir pasta</button>`;
    $('#open-folder').onclick = () => fetch('/api/open-folder', { method: 'POST' }).catch(() => {});
  }
  state.books = await DB.all('books');
  state.notes = await DB.all('notes');
  // Livros de exemplo só na versão web; o programa para Windows começa com a biblioteca vazia.
  if (!DESKTOP && !state.books.length && !pref.get('seeded', false)) { render(); await seedSamples(); }
  if (!DESKTOP && /^#foto-/.test(location.hash)) { render(); return demoShot(location.hash.slice(6)); }
  if (!window.pdfjsLib || !window.ePub) toast('Algumas bibliotecas de leitura não carregaram. Verifique a conexão e recarregue a página.', 8000);
  render();
})();
